# Actions-LEDE-B70 — Device-specific overrides
# Sourced by build.sh at build time
# Deployed to /etc/openwrt-device.conf on the router
# Sourced by reset scripts at runtime
RELEASE_NAME=b70
REPO_BRANCH=master
ZEROTIER_VERSION=latest
FEED_FORCE_PACKAGES="smartdns luci-app-smartdns"
BUILD_CACHE_DIR="${GITHUB_WORKSPACE:+$GITHUB_WORKSPACE/cache}"
GITHUB_REPO="zgc0220/Actions-LEDE-B70"
# HiWiFi HC5962 uses NAND flash; install firmware via LuCI sysupgrade or
# factory image. DISK stays unset intentionally because dd raw writes do not apply.
