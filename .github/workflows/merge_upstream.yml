name: Rebase Base

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

env:
  BASE_REPO: https://github.com/zgc/Actions-LEDE
  BASE_BRANCH: main

concurrency:
  group: firmware-lifecycle-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        lfs: true
        token: ${{ secrets.SEC_TOKEN || github.token }}

    - name: Set git identity
      run : |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Check Base
      id: base
      run:  |
        git remote remove base >/dev/null 2>&1 || true
        git remote add base "$BASE_REPO"
        git fetch --force base
        if git merge-base --is-ancestor "base/$BASE_BRANCH" HEAD; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "✅ base already up to date"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Rebase Base commits
      if: steps.base.outputs.changed == 'true'
      run: |
        # 冲突必须失败并人工处理，禁止用 merge=ours 静默保留旧设备文件。
        git rebase "base/$BASE_BRANCH"

    - name: Push Commits
      if: steps.base.outputs.changed == 'true'
      env:
        DOWNSTREAM_BRANCH: main
      run: git push --force-with-lease origin $DOWNSTREAM_BRANCH
